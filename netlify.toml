[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/welcome"
  status = 302

[[redirects]]
  from = "/welcome"
  to = "/Parallax-website-main/index.html"
  status = 200

[[redirects]]
  from = "/Parallax-website-main/*"
  to = "/Parallax-website-main/:splat"
  status = 200

[[redirects]]
  from = "/home"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/communities"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
