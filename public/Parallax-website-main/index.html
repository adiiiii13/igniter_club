<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to Igniter Club × GMIT. Experience our immersive landing intro and discover the community." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ignitergmit.netlify.app/welcome/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Igniter Club × GMIT" />
    <meta property="og:title" content="Welcome — Igniter Club × GMIT" />
    <meta property="og:description" content="Start your journey with Igniter Club × GMIT through an immersive intro experience." />
    <meta property="og:url" content="https://ignitergmit.netlify.app/welcome/" />
    <meta property="og:image" content="https://ignitergmit.netlify.app/welcome/img/layer-base.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Welcome — Igniter Club × GMIT" />
    <meta name="twitter:description" content="Start your journey with Igniter Club × GMIT through an immersive intro experience." />
    <meta name="twitter:image" content="https://ignitergmit.netlify.app/welcome/img/layer-base.png" />

    <title>Welcome - Igniter Club</title>

    <link rel="stylesheet" href="./scss/main.css">
    <script src="./gsap/gsap.min.js" defer></script>
    <script src="./gsap/ScrollTrigger.min.js" defer></script>
    <script src="./gsap/ScrollSmoother.min.js" defer></script>
    <script src="./js/app.js" defer></script>
</head>
<body class="intro-active">
    <div class="landing-intro" id="landingIntro" aria-label="Landing Intro">
        <p class="landing-intro__caption">IGNITING INNOVATION</p>
        <h1 class="landing-intro__wordmark" id="landingIntroWordmark" aria-label="IGNITER CLUB × GMIT"></h1>
    </div>

    <div class="wrapper">
        <div class="content">
            <header class="header">
                <div class="layers">
                    <!-- Top Return Link -->
                    <div class="parallax-top-nav">
                        <a href="/home" class="parallax-nav-back" title="Return to Igniter Club Portal">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                            <span>Club Portal</span>
                        </a>
                    </div>

                    <!-- Parallax 3 Big Logo Cards in Jungle Foliage -->
                    <!-- Left: GMIT Logo Glass Card with White Inner Badge -->
                    <div class="parallax-jungle-card parallax-jungle-card--left">
                        <a href="/home" class="parallax-glass-card parallax-glass-card--brand" title="GMIT — It's campuslife">
                            <div class="parallax-inner-badge parallax-inner-badge--white">
                                <img src="./img/gmit-campus-logo.png" alt="GMIT" class="parallax-card-logo-img parallax-card-logo-img--gmit" />
                            </div>
                        </a>
                    </div>

                    <!-- Center: Igniter Club Logo Glass Card -->
                    <div class="parallax-jungle-card parallax-jungle-card--center">
                        <a href="/home" class="parallax-glass-card parallax-glass-card--igniter" title="Igniter Club GMIT">
                            <img src="./img/igniter-tight.png" alt="Igniter Club" class="parallax-card-logo-img parallax-card-logo-img--igniter" />
                        </a>
                    </div>

                    <!-- Right: JIS University Logo Glass Card with White Text -->
                    <div class="parallax-jungle-card parallax-jungle-card--right">
                        <a href="/home" class="parallax-glass-card parallax-glass-card--brand" title="JIS University">
                            <div class="parallax-inner-badge parallax-inner-badge--jis">
                                <img src="./img/jis-uni-white-text.png" alt="JIS University" class="parallax-card-logo-img parallax-card-logo-img--jis" />
                            </div>
                        </a>
                    </div>

                    <div class="layer layers__base" style="background-image: url(./img/layer-base.png);"></div>
                    <div class="layer layers__middle" style="background-image: url(./img/layer-middle.png);"></div>
                    <div class="layer layers__front" style="background-image: url(./img/layer-front.png);"></div>
                </div>
            </header>
            <article class="article" style="background-image: url(./img/dungeon.jpg);">
                <div class="article__content">
                    <h2 class="article__header">Ready to explore?</h2>
                    <p class="article__paragrapf">Get ready to dive deep into a world of endless tech possibilities, epic hackathons, and a community driven by innovation. Your journey starts right here.</p>
                    <a href="javascript:void(0)" onclick="window.top.location.href='/home';" style="margin-top: 2rem; display: inline-block; padding: 15px 45px; background: linear-gradient(90deg, #e11d48, #f43f5e); color: white; text-decoration: none; font-size: 1.25rem; font-weight: 700; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; font-family: sans-serif; box-shadow: 0 10px 30px rgba(225, 29, 72, 0.4); text-transform: uppercase; letter-spacing: 2px;" onmouseover="this.style.transform='scale(1.05) translateY(-2px)';" onmouseout="this.style.transform='scale(1) translateY(0)';">Dig In!</a>
                </div>
            </article>
        </div>
    </div>
</body>
</html>
